<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Merkar - Landing Page. Selecciona tu sucursal en Malaga o Soatá, o contáctanos.">
    <title>Merkar - Landing Page</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS v3 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#fb923c',
                            500: '#ea580c',
                            600: '#c2410c',
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'slide-up': 'slideUp 0.8s ease-out forwards'
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0f172a; /* Slate 900 para dark mode sofisticado */
            color: #f8fafc;
            overflow-x: hidden;
        }
        /* Estilos Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        /* Delays para animaciones en cascada */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative font-sans antialiased selection:bg-brand-500 selection:text-white">
    
    <!-- Background Animated Blobs -->
    <div class="fixed inset-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute top-0 -left-4 w-72 h-72 bg-brand-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob delay-100"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob delay-200"></div>
    </div>

    <!-- Main Content Container -->
    <main class="relative z-10 w-full max-w-4xl mx-auto px-6 py-12 flex flex-col items-center">
        
        <!-- Header -->
        <header class="text-center mb-14 opacity-0 animate-fade-in flex flex-col items-center">
            
            <!-- Logo -->
            <div class="relative mb-6 group inline-block">
                <div class="absolute -inset-2 bg-gradient-to-r from-brand-500 to-purple-600 rounded-3xl blur opacity-25 group-hover:opacity-50 transition duration-500"></div>
                <img src="public/images/logo de laura.jpeg" alt="Logo Merkar" class="relative w-48 md:w-64 h-auto object-contain rounded-2xl shadow-2xl transform transition duration-500 group-hover:scale-105">
            </div>
            
            <h1 class="sr-only">Merkar</h1>
            
            <p class="text-lg md:text-xl text-slate-300 max-w-xl mx-auto font-light leading-relaxed">
                Selecciona la sucursal de tu preferencia o comunícate con nosotros para brindarte el mejor servicio.
            </p>
        </header>

        <!-- Buttons Grid / List -->
        <div class="w-full max-w-md space-y-6">
            
            <!-- Botón 1: Merkar Malaga -->
            <!-- NOTA: Reemplazar el href "#" con el enlace de Google Maps -->
            <a href="https://maps.app.goo.gl/x7iehek3RxB62GNE7" class="group relative block opacity-0 animate-slide-up delay-100 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 focus:ring-offset-slate-900 rounded-2xl">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-brand-500 to-purple-600 rounded-2xl blur opacity-40 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative flex items-center justify-between glass-panel p-5 rounded-2xl hover:bg-white/10 transition-all duration-300 transform group-hover:-translate-y-1">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-full bg-brand-500/20 flex items-center justify-center text-brand-400 group-hover:scale-110 group-hover:bg-brand-500 group-hover:text-white transition-all duration-300 shadow-inner">
                            <i class="fa-solid fa-map-location-dot text-2xl"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white tracking-wide">Merkar Malaga</h2>
                            <span class="text-sm text-slate-400 font-medium">Visitar sede en Maps</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition-colors group-hover:translate-x-1 transform duration-300"></i>
                </div>
            </a>

            <!-- Botón 2: Merkar Soatá -->
            <!-- NOTA: Reemplazar el href "#" con el enlace de Google Maps -->
            <a href="https://maps.app.goo.gl/9aWKdkwTuhdiMtc46" class="group relative block opacity-0 animate-slide-up delay-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900 rounded-2xl">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-cyan-400 rounded-2xl blur opacity-40 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative flex items-center justify-between glass-panel p-5 rounded-2xl hover:bg-white/10 transition-all duration-300 transform group-hover:-translate-y-1">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 group-hover:scale-110 group-hover:bg-blue-500 group-hover:text-white transition-all duration-300 shadow-inner">
                            <i class="fa-solid fa-map-location-dot text-2xl"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white tracking-wide">Merkar Soatá</h2>
                            <span class="text-sm text-slate-400 font-medium">Visitar sede en Maps</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition-colors group-hover:translate-x-1 transform duration-300"></i>
                </div>
            </a>

            <!-- Botón 3: Contacto WhatsApp -->
            <a href="https://wa.me/573112269629" target="_blank" rel="noopener noreferrer" class="group relative block opacity-0 animate-slide-up delay-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 focus:ring-offset-slate-900 rounded-2xl">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-green-500 to-emerald-400 rounded-2xl blur opacity-40 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative flex items-center justify-between glass-panel p-5 rounded-2xl hover:bg-white/10 transition-all duration-300 transform group-hover:-translate-y-1">
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 rounded-full bg-green-500/20 flex items-center justify-center text-green-400 group-hover:scale-110 group-hover:bg-green-500 group-hover:text-white transition-all duration-300 shadow-inner">
                            <i class="fa-brands fa-whatsapp text-3xl"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white tracking-wide">Contacto</h2>
                            <span class="text-sm text-slate-400 font-medium">Escríbenos por WhatsApp</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition-colors group-hover:translate-x-1 transform duration-300"></i>
                </div>
            </a>

        </div>

        <!-- Footer -->
        <footer class="mt-16 text-center opacity-0 animate-fade-in delay-300">
            <p class="text-sm text-slate-500 font-medium tracking-wide">© 2026 Merkar. Todos los derechos reservados.</p>
        </footer>

    </main>

</body>
</html>
